[project]
name = "delegate-mcp"
version = "0.1.0"
description = "MCP server that delegates work from Claude Code to a worker agent CLI and verifies the result"
authors = [
    { name = "Joseph Cavarretta", email = "j.cavarretta@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
delegate-mcp = "delegate_mcp.main:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
