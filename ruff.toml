# Lint config for the harness itself; other repos extend the base the same way.
extend = "python-styleguide/ruff-base.toml"
# The guide's code blocks include deliberately wrong examples; keep them as written.
extend-exclude = ["python-styleguide/python-styleguide.md"]

[lint.extend-per-file-ignores]
# copier renders "{{ package_name }}" into a real package name; the placeholder is not one.
"templates/python-project/template/src/**" = ["N999"]
