MinAlertLevel = warning

Packages = Google
IgnoredScopes = code, tt, frontmatter

[*.{md,mdx}]
BasedOnStyles = Vale, Google, House

TokenIgnores = (\[\[[^\]]+\]\]), (\*\*Last updated:\*\* [^\n]+), (\*\*Sources:\*\* [^\n]+)

# Tuning Google rules for engineering documentation and specs
Google.WordList = NO
Google.WordListCase = NO
Google.Headings = NO
Google.Acronyms = NO
Google.Parens = NO
Google.Latin = NO
Google.Contractions = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.Colons = NO
Google.Quotes = NO
Google.FirstPerson = NO
Google.OxfordComma = NO
Google.DateFormat = NO
Google.Units = NO
Google.Ordinal = NO
Google.Ranges = NO
Google.LyHyphens = NO
Google.Slang = NO
Vale.Spelling = NO

# Enforce core principles
Google.We = error
Google.Will = warning
Google.Passive = suggestion
Google.OptionalPlurals = warning
Google.Exclamation = warning
House.Headings = warning
House.WordList = warning
House.Filler = warning
House.Links = warning
House.EmDash = suggestion
House.BoldBullet = warning
House.ListPunctuation = warning
House.ZeroQuantifier = warning
House.ZeroQuantifierAdj = warning

# Future tense ('will') is natural in forward-looking plans, proposals, TRDs, and PRDs
[*{plans,proposals,trd,prd}/*.{md,mdx}]
Google.Will = NO

[**/{plans,proposals,trd,prd}/**/*.{md,mdx}]
Google.Will = NO

# Generated indices, logs, and agent instruction files
[{INDEX,log,CHANGELOG,CLAUDE,CLAUDE.*,AGENTS,SKILL}.md]
BasedOnStyles =

[**/{raw,archive,_templates,.github}/**/*.{md,mdx}]
BasedOnStyles =
