# Type-check settings for the harness's own Python. mcp/delegate has its own in its
# pyproject.toml. The extensionless tools/bin scripts all share the module name
# __main__, so they are checked one at a time: `mypy --strict tools/bin/<script>`.
[mypy]
strict = True
files = claude, vault/hooks, python-styleguide, tools/tests, templates/tests
